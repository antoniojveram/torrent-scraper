services:
  torrent-scraper:
    build: .
    container_name: torrent-scraper
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Montar movies.json para poder editarlo sin reconstruir la imagen
      - ./movies.json:/app/movies.json
      # Montar directorio para ver los resultados
      - ./results:/app/results
    environment:
      - TZ=Europe/Madrid
    # DNS públicos para evitar bloqueos/filtrados del DNS local en dominios de torrents
    dns:
      - 1.1.1.1
      - 8.8.8.8
